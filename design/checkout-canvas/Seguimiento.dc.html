<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    :root{
      --primary:#ff7d07; --cream:#fbf2e1; --maroon:#932810; --forest:#007239;
      --gold:#f5a202; --olive:#9cbf3d; --violet:#5f54a6; --coral:#e2565b; --teal:#129892;
      --ink:#641b0b; --muted:#804437; --border:#e6dbd8;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'Nunito',sans-serif; color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; }
    h1,h2{ font-family:'Baloo 2',sans-serif; line-height:1.1; margin:0; }
    a{ color:inherit; text-decoration:none; }
    input{ font-family:'Nunito',sans-serif; width:100%; font-size:14px; padding:11px 14px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--ink); outline:none; }
    input:focus{ outline:2px solid var(--ink); outline-offset:1px; }
    .field-label{ display:block; font-size:13px; font-weight:800; color:var(--ink); margin-bottom:6px; }
  </style>
</helmet>

<div style="min-height:100%; background:var(--cream); display:flex; flex-direction:column;">

  <header style="border-bottom:1px solid var(--border); background:#fff; padding:20px 40px; display:flex; align-items:center; justify-content:center;">
    <a href="#" style="display:flex; align-items:center; gap:10px;">
      <img src="felipe-logo.svg" alt="" width="34" height="36" style="display:block;">
      <span style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--ink); letter-spacing:-0.01em;">Taller Azotea</span>
    </a>
  </header>

  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:56px 24px;">
    <div style="width:100%; max-width:480px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:44px 40px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px;">

      <div style="width:64px; height:64px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--maroon)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <h1 style="font-size:26px; color:var(--ink);">Sigue tu pedido</h1>
        <p style="font-size:14.5px; line-height:1.6; color:var(--muted); max-width:360px; margin:0 auto;">
          Ingresa el número de tu pedido y el correo con el que lo hiciste para ver en qué va.
        </p>
      </div>

      <div style="width:100%; display:flex; flex-direction:column; gap:16px; text-align:left;">
        <label class="block">
          <span class="field-label">Número de pedido</span>
          <input type="text" placeholder="Ej. AZ-1052" value="AZ-1052">
        </label>
        <label class="block">
          <span class="field-label">Correo electrónico</span>
          <input type="email" placeholder="tucorreo@ejemplo.com" value="jose@yopmail.com">
        </label>
      </div>

      <button type="button" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:16px; background:var(--maroon); color:#fff; border:none; border-radius:6px; font-weight:800; font-size:15.5px;">
        Buscar pedido
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>

      <p style="font-size:12.5px; line-height:1.6; color:var(--muted); margin:0;">
        ¿No encuentras tu número de pedido? Revisa el mensaje de WhatsApp que te enviamos al confirmar la compra.
      </p>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
